<meta name="theme-color" content="#24477f">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17202b;--muted:#5b6675;--accent:#24477f;--accent-ink:#fff;--soft:#e6ecf6;--line:#d9dee6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#182131;--ink:#e7ebf1;--muted:#9aa5b4;--accent:#8fb0ea;--accent-ink:#0f1726;--soft:#1f2c42;--line:#2b3850}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:24px 16px;word-break:keep-all}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px 26px;text-align:center;box-shadow:0 10px 30px rgba(20,40,74,.08)}
.art{margin:0 auto 16px;max-width:230px}.art img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}.art figcaption{margin-top:8px;font-size:13px;color:var(--muted)}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:4px 12px;margin:0 0 10px}
h1{margin:0 0 10px;font-size:24px;line-height:1.35}
p{margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.6}
.go{display:block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:17px;padding:15px 18px;border-radius:12px}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.addr{margin-top:14px;font-size:13px;color:var(--muted)}
.addr b{color:var(--ink);font-weight:600;word-break:break-all}
.note{margin-top:16px;font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.55}
</style>
</head>
